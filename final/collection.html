<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Switch: Platform to Exchange Puzzles</title>
    <meta name="description"
        content="Platform for people to contribute and select puzzles for a Final Project for WDD 231 class">
    <meta name="author" content="Alana Fox">
    <meta property="og:title" content="Puzzle Switch: Platform to Exchange Puzzles">
    <meta property="og:type" content="website">
    <meta property="og:description"
        content="Site for individuals can join with other puzzle solvers to exchange puzzles">
    <meta property="og:image" content="https://afox-kitsune.github.io/wdd231/final/images/Screenshot-collection.png">
    <meta property="og:image:height" content="1600">
    <meta property="og:image:width" content="800">
    <meta property="og:url" content="https://afox-kitsune.github.io/wdd231/final/collection.html">

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">


    <link rel="icon" href="images/favicon.ico" sizes="any">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/apple-touch-favicon.png">


    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/final-small.css">
    <link rel="stylesheet" href="styles/final-large.css" media="(min-width: 768px)">


    <script src="scripts/main.js" type="module"></script>
</head>

<body>
    <header>
        <a href="main.html" class="logo">
            <img src="images/favicon.svg" alt="Puzzle Switch Logo">
            <span>Puzzle Switch</span>
        </a>

        <nav class="main-navigation">
            <a href="main.html">Home</a>
            <a href="collection.html" class="active">Collection</a>
            <a href="form.html">Switch</a>
        </nav>

        <div class="header-utilities-container">
            <button id="menu-button" aria-label="Toggle Navigation Menu"></button>
            <div class="header-controls">
                <button id="theme-toggle-button" aria-label="Toggle Dark Mode"></button>
            </div>
        </div>
    </header>

    <main>
        <div class="hero-banner collection-hero">
            <img src="images/collection.png" alt="Puzzle Switch Logo Background Banner" class="banner-img">
        </div>

        <div class="filters">
            <h1 class="filter-h1">Search Puzzle Collection:</h1>
            <div class="filter-group">
                <label for="shapeFilter">Shape</label>
                <select id="shapeFilter" onchange="filterPuzzles()">
                    <option value="all">All Shapes</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="countFilter">Piece Count</label>
                <select id="countFilter" onchange="filterPuzzles()">
                    <option value="all">All Counts</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="typeFilter">Type</label>
                <select id="typeFilter" onchange="filterPuzzles()">
                    <option value="all">All Types</option>
                </select>
            </div>
        </div>

        <div id="puzzleGrid" class="puzzle-grid"></div>
    </main>
    <footer>
        <p>&copy; <span id="current-year"></span> Puzzle Switch</p>
        <p>Alana Fox | WDD 231 Final Project</p>
        <p><a href="attributions.html">Attributions</a></p>
        <p>Project Video</p>
    </footer>


</body>

</html>
